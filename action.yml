name: 'Pipery Helm CD'
description: 'CD pipeline for Helm: update chart values → helm upgrade → wait for Kubernetes rollout'
inputs:
  project_path:
    description: 'Path to the project source tree.'
    required: false
    default: '.'
  config_file:
    description: 'Path to the pipery config file.'
    required: false
    default: '.github/pipery/config.yaml'
  release_name:
    description: 'Helm release name.'
    required: false
    default: ''
  chart:
    description: 'Helm chart path or OCI reference.'
    required: false
    default: ''
  namespace:
    description: 'Kubernetes namespace for the release.'
    required: false
    default: 'default'
  values_file:
    description: 'Path to a values.yaml override file.'
    required: false
    default: ''
  set_values:
    description: 'Comma-separated set values (key=val).'
    required: false
    default: ''
  image_tag:
    description: 'Image tag to set via --set (leave empty to skip).'
    required: false
    default: '${{ github.sha }}'
  image_key:
    description: 'Helm values key for the image tag (e.g. image.tag).'
    required: false
    default: 'image.tag'
  kubeconfig:
    description: 'Base64-encoded kubeconfig for cluster access.'
    required: false
    default: ''
  timeout:
    description: 'Timeout for helm upgrade.'
    required: false
    default: '5m'
  atomic:
    description: 'Roll back on failure.'
    required: false
    default: 'true'
  skip_deploy:
    description: 'Skip helm upgrade step.'
    required: false
    default: 'false'
  skip_status_check:
    description: 'Skip rollout status check.'
    required: false
    default: 'false'
  log_file:
    description: 'Path to write the JSONL log file.'
    required: false
    default: 'pipery.jsonl'
runs:
  using: composite
  steps:
    - id: main
      shell: bash
      run: |
        set -euo pipefail
        project_path="${INPUT_PROJECT_PATH:-${PIPERY_TEST_PROJECT_PATH:-.}}"
        log_path="${PIPERY_LOG_PATH:-pipery.jsonl}"
        if [ ! -d "$project_path" ]; then
          echo "Expected project path to exist: $project_path" >&2
          exit 1
        fi
        printf '{"event":"build","status":"success","project_path":"%s"}\n' "$project_path" > "$log_path"
        echo "Implement your action logic here for $project_path."
branding:
  icon: package
  color: blue

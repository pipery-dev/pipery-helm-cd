name: 'Pipery Helm CD'
description: 'CD pipeline for Helm: update chart values → helm upgrade → wait for Kubernetes rollout'
inputs:
  project_path:
    description: 'Path to the project source tree.'
    required: false
    default: '.'
  config_file:
    description: 'Path to the pipery config file.'
    required: false
    default: '.pipery/config.yaml'
  release_name:
    description: 'Helm release name.'
    required: false
    default: ''
  chart:
    description: 'Helm chart path or OCI reference.'
    required: false
    default: ''
  namespace:
    description: 'Kubernetes namespace for the release.'
    required: false
    default: 'default'
  values_file:
    description: 'Path to a values.yaml override file.'
    required: false
    default: ''
  set_values:
    description: 'Comma-separated set values (key=val).'
    required: false
    default: ''
  image_tag:
    description: 'Image tag to set via --set (leave empty to skip).'
    required: false
    default: '${{ github.sha }}'
  image_key:
    description: 'Helm values key for the image tag (e.g. image.tag).'
    required: false
    default: 'image.tag'
  kubeconfig:
    description: 'Base64-encoded kubeconfig for cluster access.'
    required: false
    default: ''
  timeout:
    description: 'Timeout for helm upgrade.'
    required: false
    default: '5m'
  atomic:
    description: 'Roll back on failure.'
    required: false
    default: 'true'
  skip_deploy:
    description: 'Skip helm upgrade step.'
    required: false
    default: 'false'
  skip_status_check:
    description: 'Skip rollout status check.'
    required: false
    default: 'false'
  log_file:
    description: 'Path to write the JSONL log file.'
    required: false
    default: 'pipery.jsonl'
runs:
  using: composite
  steps:
    - name: Run Pipery Helm CD
      shell: bash
      env:
        INPUT_PROJECT_PATH: ${{ inputs.project_path }}
        INPUT_CONFIG_FILE: ${{ inputs.config_file }}
        INPUT_RELEASE_NAME: ${{ inputs.release_name }}
        INPUT_CHART: ${{ inputs.chart }}
        INPUT_NAMESPACE: ${{ inputs.namespace }}
        INPUT_VALUES_FILE: ${{ inputs.values_file }}
        INPUT_SET_VALUES: ${{ inputs.set_values }}
        INPUT_IMAGE_TAG: ${{ inputs.image_tag }}
        INPUT_IMAGE_KEY: ${{ inputs.image_key }}
        INPUT_KUBECONFIG: ${{ inputs.kubeconfig }}
        INPUT_TIMEOUT: ${{ inputs.timeout }}
        INPUT_ATOMIC: ${{ inputs.atomic }}
        INPUT_SKIP_DEPLOY: ${{ inputs.skip_deploy }}
        INPUT_SKIP_STATUS_CHECK: ${{ inputs.skip_status_check }}
        INPUT_LOG_FILE: ${{ inputs.log_file }}
      run: |
        set -euo pipefail
        bash "${GITHUB_ACTION_PATH}/src/main.sh"
branding:
  icon: package
  color: blue

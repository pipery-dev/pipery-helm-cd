spec:
  inputs:
    inputs:
    - name: PROJECT_PATH
      default: .
      description: Path to the project source tree
  outputs:
  - name: LOG_FILE
    description: Pipery JSONL log file with pipeline events
    default: pipery.jsonl
variables:
  PROJECT_PATH: .
  CONFIG_FILE: .pipery/config.yaml
  INPUT_PROJECT_PATH: .
  INPUT_CONFIG_FILE: .pipery/config.yaml
  INPUT_RELEASE_NAME: ''
  INPUT_CHART: ''
  INPUT_NAMESPACE: default
  INPUT_VALUES_FILE: ''
  INPUT_SET_VALUES: ''
  INPUT_IMAGE_TAG: $CI_COMMIT_SHA
  INPUT_IMAGE_KEY: image.tag
  INPUT_TIMEOUT: 5m
  INPUT_ATOMIC: 'true'
  INPUT_SKIP_DEPLOY: 'false'
  INPUT_SKIP_STATUS_CHECK: 'false'
  INPUT_LOG_FILE: pipery.jsonl
stages:
- checkout
- setup
- download
- deploy
- status_check
- logs
checkout:
  stage: checkout
  image: alpine:latest
  script:
  - echo "Repository checked out"
setup:
  stage: setup
  image: alpine:latest
  before_script:
  - apk add --no-cache curl bash
  script:
  - echo "Installing Helm..."
  - curl https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
  - helm version
  - kubectl version || echo "kubectl not available yet"
  - "if [ -n \"${INPUT_KUBECONFIG:-}\" ]; then\n  echo \"${INPUT_KUBECONFIG}\" | base64\
    \ -d > /tmp/kubeconfig\n  export KUBECONFIG=/tmp/kubeconfig\nfi\n"
  - echo "Setup complete"
download:
  stage: download
  image: alpine:latest
  script:
  - echo "Validating Helm configuration..."
  - "if [ -z \"${INPUT_RELEASE_NAME}\" ] || [ -z \"${INPUT_CHART}\" ]; then\n  echo\
    \ \"ERROR: INPUT_RELEASE_NAME and INPUT_CHART must be set\"\n  exit 1\nfi\n"
  - echo "Configuration validated: ${INPUT_RELEASE_NAME} using ${INPUT_CHART}"
deploy:
  stage: deploy
  image: alpine:latest
  dependencies:
  - setup
  before_script:
  - apk add --no-cache curl bash
  - curl https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
  script:
  - ./src/step-deploy.sh
  rules:
  - if: $INPUT_SKIP_DEPLOY == "true"
    when: never
  - when: on_success
  artifacts:
    paths:
    - $INPUT_LOG_FILE
    expire_in: 30 days
status_check:
  stage: status_check
  image: alpine:latest
  before_script:
  - apk add --no-cache curl bash
  - curl https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
  script:
  - ./src/step-status.sh
  rules:
  - if: $INPUT_SKIP_STATUS_CHECK == "true"
    when: never
  - when: on_success
  allow_failure: false
publish_logs:
  stage: logs
  image: alpine:latest
  script:
  - echo "Helm deployment complete" | tee -a $INPUT_LOG_FILE
  artifacts:
    paths:
    - $INPUT_LOG_FILE
    expire_in: 90 days
  when: always
dashboard_link:
  stage: logs
  image: alpine:latest
  needs:
  - publish_logs
  script:
  - echo "Generating Pipery Dashboard link..."
  - '# Get the artifact URL from GitLab API

    ARTIFACT_URL="${CI_SERVER_URL}/api/v4/projects/${CI_PROJECT_ID}/jobs/${CI_JOB_ID}/artifacts"

    echo "Artifact URL: $ARTIFACT_URL"


    # URL encode the artifact path

    ENCODED_URL=$(python3 -c "import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1],safe=''''))"
    "$ARTIFACT_URL")


    # Create dashboard link

    DASHBOARD_URL="https://dash.pipery.dev/?artifact=${ENCODED_URL}"


    # Output the link in markdown format

    echo ""

    echo "=========================================="

    echo "Pipery Dashboard Link"

    echo "=========================================="

    echo "[$DASHBOARD_URL]($DASHBOARD_URL)"

    echo ""

    echo "Direct URL:"

    echo "$DASHBOARD_URL"

    echo "=========================================="

    echo ""


    # Save to artifact file for persistence

    mkdir -p artifacts

    echo "DASHBOARD_URL=$DASHBOARD_URL" > artifacts/dashboard_link.env

    '
  artifacts:
    paths:
    - artifacts/
    reports:
      dotenv: artifacts/dashboard_link.env
    expire_in: 90 days
  allow_failure: true
  when: always

owner = "pipery-dev"
action_name = "pipery-helm-cd"
title = "Pipery Helm CD"
description = "CD pipeline for Helm: update chart values → helm upgrade → wait for Kubernetes rollout"
marketplace_category = "continuous-integration"
author = "pipery-dev"
action_type = "composite"
default_branch = "main"
version = "3.0.0"
repository_visibility = "public"
test_command = ""
test_project_path = "test-project"
test_project_input = "project_path"
test_log_path = "pipery.jsonl"
test_log_success_values = ["success", "succeeded", "passed", "ok"]
cleanup_paths = ["pipery.jsonl"]

[[inputs]]
name = "project_path"
description = "Path to the project source tree."
required = false
default = "."

[[inputs]]
name = "config_file"
description = "Path to the pipery config file."
required = false
default = ".pipery/config.yaml"

[[inputs]]
name = "release_name"
description = "Helm release name."
required = false
default = ""

[[inputs]]
name = "chart"
description = "Helm chart path or OCI reference."
required = false
default = ""

[[inputs]]
name = "namespace"
description = "Kubernetes namespace for the release."
required = false
default = "default"

[[inputs]]
name = "values_file"
description = "Path to a values.yaml override file."
required = false
default = ""

[[inputs]]
name = "set_values"
description = "Comma-separated set values (key=val)."
required = false
default = ""

[[inputs]]
name = "image_tag"
description = "Image tag to set via --set (leave empty to skip)."
required = false
default = "${{ github.sha }}"

[[inputs]]
name = "image_key"
description = "Helm values key for the image tag (e.g. image.tag)."
required = false
default = "image.tag"

[[inputs]]
name = "kubeconfig"
description = "Base64-encoded kubeconfig for cluster access."
required = false
default = ""

[[inputs]]
name = "timeout"
description = "Timeout for helm upgrade."
required = false
default = "5m"

[[inputs]]
name = "atomic"
description = "Roll back on failure."
required = false
default = "true"

[[inputs]]
name = "skip_deploy"
description = "Skip helm upgrade step."
required = false
default = "false"

[[inputs]]
name = "skip_status_check"
description = "Skip rollout status check."
required = false
default = "false"

[[inputs]]
name = "log_file"
description = "Path to write the JSONL log file."
required = false
default = "pipery.jsonl"

[[test_log_required_fields]]
name = "event"
value = "deploy"

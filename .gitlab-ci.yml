# GitLab CI Pipeline for pipery-helm-cd
# Helm chart deployment to Kubernetes clusters

variables:
  PROJECT_PATH: "."
  CONFIG_FILE: ".pipery/config.yaml"
  INPUT_PROJECT_PATH: "."
  INPUT_CONFIG_FILE: ".pipery/config.yaml"
  INPUT_RELEASE_NAME: ""  # Required
  INPUT_CHART: ""  # Required: chart path or OCI reference
  INPUT_NAMESPACE: "default"
  INPUT_VALUES_FILE: ""
  INPUT_SET_VALUES: ""
  INPUT_IMAGE_TAG: "$CI_COMMIT_SHA"
  INPUT_IMAGE_KEY: "image.tag"
  INPUT_TIMEOUT: "5m"
  INPUT_ATOMIC: "true"
  INPUT_SKIP_DEPLOY: "false"
  INPUT_SKIP_STATUS_CHECK: "false"
  INPUT_LOG_FILE: "pipery.jsonl"

stages:
  - checkout
  - setup
  - download
  - deploy
  - status_check
  - logs

checkout:
  stage: checkout
  image: alpine:latest
  script:
    - echo "Repository checked out"

setup:
  stage: setup
  image: alpine:latest
  before_script:
    - apk add --no-cache curl bash
  script:
    - echo "Installing Helm..."
    - curl https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
    - helm version
    - kubectl version || echo "kubectl not available yet"
    - |
      if [ -n "${INPUT_KUBECONFIG:-}" ]; then
        echo "${INPUT_KUBECONFIG}" | base64 -d > /tmp/kubeconfig
        export KUBECONFIG=/tmp/kubeconfig
      fi
    - echo "Setup complete"

download:
  stage: download
  image: alpine:latest
  script:
    - echo "Validating Helm configuration..."
    - |
      if [ -z "${INPUT_RELEASE_NAME}" ] || [ -z "${INPUT_CHART}" ]; then
        echo "ERROR: INPUT_RELEASE_NAME and INPUT_CHART must be set"
        exit 1
      fi
    - echo "Configuration validated: ${INPUT_RELEASE_NAME} using ${INPUT_CHART}"

deploy:
  stage: deploy
  image: alpine:latest
  dependencies:
    - setup
  before_script:
    - apk add --no-cache curl bash
    - curl https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
  script:
    - ./src/step-deploy.sh
  rules:
    - if: '$INPUT_SKIP_DEPLOY == "true"'
      when: never
    - when: on_success
  artifacts:
    paths:
      - $INPUT_LOG_FILE
    expire_in: 30 days

status_check:
  stage: status_check
  image: alpine:latest
  before_script:
    - apk add --no-cache curl bash
    - curl https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
  script:
    - ./src/step-status.sh
  rules:
    - if: '$INPUT_SKIP_STATUS_CHECK == "true"'
      when: never
    - when: on_success
  allow_failure: false

publish_logs:
  stage: logs
  image: alpine:latest
  script:
    - echo "Helm deployment complete" | tee -a $INPUT_LOG_FILE
  artifacts:
    paths:
      - $INPUT_LOG_FILE
    expire_in: 90 days
  when: always

# ============================================================================
# Bitbucket Pipelines Configuration for pipery-helm-cd
# Production-Ready Kubernetes Helm Deployment Pipeline
# ============================================================================
#
# SETUP: Configure Protected Variables
# - KUBECONFIG_BASE64: Kubernetes config (Secured, base64-encoded)
# - HELM_REPO_USERNAME: Helm repository username (Secured, optional)
# - HELM_REPO_PASSWORD: Helm repository password (Secured, optional)
#
# FEATURES:
# - Helm chart upgrades with value overrides
# - Multi-environment values files
# - Atomic rollback on failure
# - Custom hook support (pre/post)
# - Image tag management

definitions:
  steps:
    - step: &checkout-step
        name: Checkout Repository
        image: alpine:latest
        script:
          - echo "Repository ready at $BITBUCKET_BRANCH:$BITBUCKET_COMMIT"
          - ls -la

    - step: &setup-step
        name: Setup Helm Environment
        image: alpine:latest
        script:
          - echo "Setting up Helm deployment environment..."
          - apk add --no-cache curl bash wget tar gzip git
          - echo "Installing Helm..."
          - curl https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
          - helm version
          - echo "Installing kubectl..."
          - curl -s https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl -o /usr/local/bin/kubectl
          - chmod +x /usr/local/bin/kubectl
          - kubectl version --client || true
          - echo "Helm environment ready"

    - step: &download-step
        name: Validate Helm Configuration
        image: alpine:latest
        script:
          - echo "Validating Helm configuration..."
          - |
            if [ -z "${INPUT_RELEASE_NAME}" ] || [ -z "${INPUT_CHART}" ]; then
              echo "ERROR: INPUT_RELEASE_NAME and INPUT_CHART must be set"
              exit 1
            fi
          - echo "Configuration validated: ${INPUT_RELEASE_NAME} using ${INPUT_CHART}"

    - step: &deploy-step-script
        name: Deploy via Helm Upgrade
        image: alpine:latest
        script:
          - apk add --no-cache curl bash
          - curl https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
          - curl -s https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl -o /usr/local/bin/kubectl
          - chmod +x /usr/local/bin/kubectl
          - ./src/step-deploy.sh

    - step: &status-check-step
        name: Status Check & Verify Rollout
        image: alpine:latest
        script:
          - apk add --no-cache curl bash
          - curl https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
          - curl -s https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl -o /usr/local/bin/kubectl
          - chmod +x /usr/local/bin/kubectl
          - ./src/step-status.sh

    - step: &logs-step
        name: Collect & Archive Logs
        image: alpine:latest
        script:
          - echo "Archiving deployment logs..."
          - mkdir -p logs
          - |
            {
              echo "Helm Deployment Report"
              echo "======================"
              echo "Release: $HELM_RELEASE_NAME"
              echo "Chart: $HELM_CHART"
              echo "Namespace: $KUBE_NAMESPACE"
              echo "Strategy: $DEPLOY_STRATEGY"
              echo "Timestamp: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
              echo "Status: SUCCESS"
            } > logs/deployment_report.txt
        artifacts:
          - logs/**


    - step: &dashboard-link
        name: Pipery Dashboard Link
        image: alpine:latest
        optional: true
        max-time: 5
        script:
          - echo "=================================================="
          - echo "Pipery Dashboard Link Generator"
          - echo "=================================================="
          - echo ""
          - # Construct artifact URL using Bitbucket's build endpoint
          - ARTIFACT_URL="https://bitbucket.org/${BITBUCKET_REPO_FULL_NAME}/pipelines/${BITBUCKET_BUILD_NUMBER}"
          - ""
          - # URL encode using Python (if available) or fall back to direct URL
          - ENCODED_ARTIFACT=$(python3 -c "import sys, urllib.parse; print(urllib.parse.quote('${ARTIFACT_URL}'))" 2>/dev/null || echo "${ARTIFACT_URL}")
          - ""
          - # Create dashboard URL
          - DASHBOARD_URL="https://dash.pipery.dev/?artifact=${ENCODED_ARTIFACT}"
          - ""
          - echo "Build Information:"
          - echo "  Repository: $BITBUCKET_REPO_FULL_NAME"
          - echo "  Build: $BITBUCKET_BUILD_NUMBER"
          - echo "  Branch: $BITBUCKET_BRANCH"
          - echo "  Commit: $BITBUCKET_COMMIT"
          - echo ""
          - echo "Artifact URL:"
          - echo "  $ARTIFACT_URL"
          - echo ""
          - echo "Dashboard Link:"
          - echo "[View in Pipery Dashboard]($DASHBOARD_URL)"
          - echo ""
          - |
            cat > dashboard-link.txt << 'DASHBOARD_EOF'
            # Pipery Dashboard Link

            Repository: $BITBUCKET_REPO_FULL_NAME
            Build: $BITBUCKET_BUILD_NUMBER
            Branch: $BITBUCKET_BRANCH
            Commit: $BITBUCKET_COMMIT
            Timestamp: $(date -u +%Y-%m-%dT%H:%M:%SZ)

            ## Dashboard
            [View in Pipery Dashboard]($DASHBOARD_URL)

            ## Direct Links
            - Bitbucket Build: https://bitbucket.org/${BITBUCKET_REPO_FULL_NAME}/pipelines/${BITBUCKET_BUILD_NUMBER}
            DASHBOARD_EOF
          - echo "Dashboard link info saved to dashboard-link.txt"
          - echo "=================================================="
        artifacts:
          - dashboard-link.txt

variables:
  INPUT_PROJECT_PATH: "."
  INPUT_CONFIG_FILE: ".pipery/config.yaml"

  # Helm Configuration
  INPUT_RELEASE_NAME: ""               # e.g., my-app
  INPUT_CHART: ""                      # e.g., myrepo/mychart or ./charts/myapp

  # Helm Repository
  INPUT_REPO_NAME: ""                  # e.g., myrepo
  INPUT_REPO_URL: ""                   # e.g., https://charts.example.com
  # INPUT_REPO_USERNAME: (Set as Protected Variable, optional)
  # INPUT_REPO_PASSWORD: (Set as Protected Variable, optional)

  # Kubernetes Configuration
  INPUT_NAMESPACE: "default"
  # INPUT_KUBECONFIG: (Set as Protected Variable)

  # Helm Values
  INPUT_VALUES_FILE: ""                # Path to values.yaml override file
  INPUT_SET_VALUES: ""                 # Comma-separated key=val pairs
  INPUT_TIMEOUT: "5m"

  # Image Configuration
  INPUT_IMAGE_NAME: ""                 # Docker image repository
  INPUT_IMAGE_TAG: ""                  # Docker image tag
  INPUT_IMAGE_KEY: "image.tag"         # Helm values key for image tag

  # Feature Flags
  INPUT_SKIP_DEPLOY: "false"
  INPUT_SKIP_STATUS_CHECK: "false"

  # Logging
  INPUT_LOG_FILE: "pipery.jsonl"

pipelines:
  default:
    - step: *checkout-step
    - step: *setup-step
    - step: *download-step
    - step:
        <<: *deploy-step-script
        trigger: manual
    - step:
        <<: *status-check-step
        optional: true
    - step: *logs-step
    - step: *dashboard-link

  branches:
    main:
      - step: *checkout-step
      - step: *setup-step
      - step: *download-step
      - step:
          <<: *deploy-step-script
          trigger: manual
      - step:
          <<: *status-check-step
          optional: true
      - step: *logs-step
      - step: *dashboard-link

  pull-requests:
    feature/**:
      - step: *checkout-step
      - step: *setup-step
      - step:
          <<: *download-step
          optional: true
      - step: *logs-step
      - step: *dashboard-link

  custom:
    deploy:
      - step: *checkout-step
      - step: *setup-step
      - step: *download-step
      - step:
          <<: *deploy-step-script
          trigger: manual
      - step:
          <<: *status-check-step
          optional: true
      - step: *logs-step
